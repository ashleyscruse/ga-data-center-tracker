[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ga-data-center-tracker"
version = "0.1.0"
description = "County-level dataset of data center activity across Georgia's 159 counties for the Drawdown Georgia Solutions Tracker."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Ashley Scruse" }]
keywords = ["data-center", "georgia", "open-data", "web-scraping", "drawdown-georgia"]

dependencies = [
    "requests>=2.31",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
# Exploratory analysis in notebooks. The core library and pipeline run without these.
analysis = ["pandas>=2.0", "jupyter"]
# Development and testing.
dev = ["pytest>=7.0"]

[project.scripts]
gdct-build-counties = "ga_data_center_tracker.counties:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ga_data_center_tracker"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
